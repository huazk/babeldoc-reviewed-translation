name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight dependencies
        run: python -m pip install PyMuPDF==1.25.2 "Pillow>=11.3,<12"
      - name: Test mapping safeguards and PDF round trip
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Check command help
        run: |
          python scripts/file_bridge.py --help
          python scripts/pdf_review.py --help
